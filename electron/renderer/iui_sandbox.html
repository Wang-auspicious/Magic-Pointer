<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
  <title>Magic Pointer Intelligence UI Sandbox</title>
  <style id="mp-iui-theme"></style>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 14px 16px;
      background: var(--bg, #ffffff);
      color: var(--text, #1f1f1d);
      font-family: "anthropic-sans", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button {
      font: inherit;
      font-size: 12.5px;
      font-weight: 450;
      padding: 5px 11px;
      border-radius: 7px;
      border: 1px solid var(--border, rgba(11, 11, 11, 0.1));
      background: var(--surface, #f7f7f5);
      color: var(--text, #1f1f1d);
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }
    button:hover {
      background: var(--hover, rgba(11, 11, 11, 0.05));
      border-color: var(--border-strong, rgba(11, 11, 11, 0.18));
    }
    button.active, button.primary {
      background: var(--accent, #d97757);
      color: #fff;
      border-color: transparent;
    }
    input[type="range"] { accent-color: var(--accent, #d97757); cursor: pointer; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card {
      background: var(--surface, #f7f7f5);
      border: 1px solid var(--border, rgba(11, 11, 11, 0.09));
      border-radius: 10px;
      padding: 12px 14px;
    }
  </style>
</head>
<body>
  <div id="mp-iui-root"></div>
  <script>
    (function () {
      var widgetId = '';
      var root = document.getElementById('mp-iui-root');
      var themeEl = document.getElementById('mp-iui-theme');

      function reportHeight() {
        if (!widgetId) return;
        var h = Math.max(120, Math.min(680, Math.ceil(document.documentElement.scrollHeight)));
        parent.postMessage({ type: 'mp-iui-resize', id: widgetId, height: h }, '*');
      }

      window.mpWidget = {
        resize: reportHeight,
        ask: function (text) {
          parent.postMessage({ type: 'mp-iui-ask', id: widgetId, prompt: String(text || '') }, '*');
        }
      };

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(reportHeight).observe(document.body);
      }

      window.addEventListener('message', function (ev) {
        var msg = ev.data;
        if (!msg || typeof msg !== 'object' || msg.type !== 'mp-iui-init') return;
        widgetId = String(msg.id || '');
        if (themeEl && typeof msg.themeCss === 'string') {
          themeEl.textContent = msg.themeCss;
        }
        root.innerHTML = String(msg.html || '');
        // Re-create script elements so browser executes inline widget scripts cleanly
        var scripts = Array.prototype.slice.call(root.querySelectorAll('script'));
        for (var i = 0; i < scripts.length; i++) {
          var oldScript = scripts[i];
          var nextScript = document.createElement('script');
          nextScript.textContent = oldScript.textContent || '';
          oldScript.parentNode.replaceChild(nextScript, oldScript);
        }
        reportHeight();
        setTimeout(reportHeight, 80);
      });

      parent.postMessage({ type: 'mp-iui-ready' }, '*');
    })();
  </script>
</body>
</html>
