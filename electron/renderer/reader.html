<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Pointer Reader</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <section id="secondary-reader" class="secondary-reader" aria-label="Magic Pointer 阅读与确认面">
      <header class="reader-header">
        <div class="reader-heading">
          <span class="reader-mark" aria-hidden="true">✦</span>
          <div>
            <div id="reader-title" class="reader-title">处理结果</div>
            <div id="reader-context" class="reader-context"></div>
          </div>
        </div>
        <button id="reader-close" class="reader-close" type="button" aria-label="关闭">×</button>
      </header>
      <main id="reader-content" class="reader-content" tabindex="0"></main>
      <footer id="reader-actions" class="reader-actions" hidden></footer>
    </section>
    <script src="reader.js"></script>
  </body>
</html>
