<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Magic Pointer Panel</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
  <section id="panel" class="panel-shell">
    <div class="panel-title" data-drag-handle="true">
      <span>Magic Pointer</span>
      <button id="close" class="panel-close" title="关闭" aria-label="关闭">×</button>
    </div>
    <div class="panel-input-row">
      <textarea id="command" rows="1" autocomplete="off" spellcheck="false" placeholder="解释、改写、翻译，或撤回上次修改"></textarea>
      <button id="run" title="执行" aria-label="执行">↑</button>
    </div>
    <div id="result" class="panel-result muted">等待当前选区</div>
  </section>
  <script src="panel.js"></script>
</body>
</html>
