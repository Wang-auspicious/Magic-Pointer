<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Pointer</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="typography.css" />
  </head>
  <body>
    <section id="panel" class="panel-shell" aria-label="Magic Pointer 命令气泡">
      <div
        id="inline-action-rail"
        class="command-capsule"
        data-state="ready"
        data-input-mode="voice"
      >
        <span id="voice-glyph" class="voice-glyph" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <input
          id="command"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-label="对当前对象下达命令"
        />
        <p id="result" class="capsule-status" aria-live="polite" hidden></p>
      </div>
    </section>
    <script src="panel.js"></script>
  </body>
</html>
