<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Magic Pointer Panel</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
  <section id="panel" class="panel-shell">
    <div id="inline-action-rail" class="inline-action-rail" data-state="ready" data-drag-handle="true">
      <span id="rail-state-icon" class="rail-state-icon" aria-hidden="true">✦</span>
      <button id="primary-intent" class="primary-intent" type="button" hidden></button>
      <div id="command-row" class="rail-command-row">
        <input id="command" type="text" autocomplete="off" spellcheck="false" placeholder="输入短命令" aria-label="Magic Pointer 短命令" />
        <button id="run" class="rail-run" type="button" title="执行" aria-label="执行">↑</button>
      </div>
      <button id="panel-close" class="panel-close" type="button" aria-label="关闭" title="关闭">×</button>
    </div>
    <div id="result" class="panel-result muted" aria-live="polite" hidden></div>
  </section>
  <script src="panel.js"></script>
</body>
</html>
