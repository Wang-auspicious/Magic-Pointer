<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Magic Pointer Panel</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
  <section id="panel" class="panel-shell">
    <div class="panel-title" data-drag-handle="true">
      <span>Magic Pointer</span>
      <button id="close" class="panel-close" title="关闭" aria-label="关闭">×</button>
    </div>
    <div id="capture" class="capture-summary" aria-live="polite">
      <div class="capture-heading">
        <span id="capture-label">正在锁定 THIS</span>
        <span id="capture-detail"></span>
      </div>
      <div id="capture-excerpt" class="capture-excerpt"></div>
    </div>
    <div id="suggestions" class="suggestion-row" aria-label="建议动作"></div>
    <div class="panel-input-row">
      <textarea id="command" rows="1" autocomplete="off" spellcheck="false" placeholder="告诉我怎么处理 THIS"></textarea>
      <button id="run" title="执行" aria-label="执行">↑</button>
    </div>
    <div id="result" class="panel-result muted" aria-live="polite" hidden></div>
  </section>
  <script src="panel.js"></script>
</body>
</html>
