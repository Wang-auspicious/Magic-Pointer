<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Pointer Result</title>
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <section id="contextual-result" class="contextual-result" data-mode="inline" aria-label="Magic Pointer 上下文结果">
      <header class="result-header">
        <div class="result-heading">
          <span class="result-mark" aria-hidden="true">✦</span>
          <div class="result-labels">
            <div id="result-intent" class="result-intent">结果</div>
            <div id="result-source" class="result-source"></div>
          </div>
        </div>
        <button id="result-close" class="result-close" type="button" aria-label="关闭">关闭</button>
      </header>
      <main id="result-content" class="result-content" tabindex="0"></main>
      <footer id="result-actions" class="result-actions">
        <button id="result-expand" class="result-expand" type="button" hidden>展开</button>
      </footer>
    </section>
    <script src="result.js"></script>
  </body>
</html>
