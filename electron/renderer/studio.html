<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Pointer</title>
  <link rel="stylesheet" href="oreo_tokens.css?v=22" />
  <link rel="stylesheet" href="oreo.css?v=22" />
  <link rel="stylesheet" href="cards.css?v=22" />
  <link rel="stylesheet" href="studio.css?v=22" />
</head>
<body class="studio">
  <div class="shell" id="shell" data-view="chat">
    <aside class="side" aria-label="工作室导航">
      <button class="side-brand" data-goto="chat" aria-label="Magic Pointer 对话">
        <span class="brand-mark" aria-hidden="true">MP</span>
        <span class="brand-copy"><b>Magic Pointer</b><small>LOCAL AGENT HARNESS</small></span>
      </button>

      <button class="side-new" id="new-chat" data-goto="chat">
        <svg aria-hidden="true"><use href="#ic-plus" /></svg><span>新对话</span>
      </button>

      <nav class="side-navigation" aria-label="主要页面">
        <div class="side-group">
          <p class="side-label">工作</p>
          <button class="side-item side-nav is-on" data-goto="chat"><svg><use href="#ic-spark" /></svg>对话</button>
          <div id="side-convos" class="side-convos"></div>
        </div>
        <div class="side-group">
          <p class="side-label">资料库</p>
          <button class="side-item side-nav" data-goto="stash"><svg><use href="#ic-stash" /></svg>收藏箱</button>
          <button class="side-item side-nav" data-goto="timeline"><svg><use href="#ic-timeline" /></svg>时间线</button>
          <button class="side-item side-nav" data-goto="memory"><svg><use href="#ic-memory" /></svg>记忆</button>
          <button class="side-item side-nav" data-goto="artifacts"><svg><use href="#ic-docs" /></svg>产物</button>
        </div>
      </nav>

      <div class="side-foot">
        <button class="side-item side-nav" data-goto="settings"><svg><use href="#ic-sliders" /></svg>设置</button>
        <p class="local-status"><span aria-hidden="true"></span>本地运行</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="workspace-header" id="workspace-header">
        <div>
          <p class="workspace-eyebrow" id="workspace-eyebrow">ACTIVE WORK</p>
          <h1 id="workspace-title">对话</h1>
          <p class="workspace-description" id="workspace-description">围绕刚才指过的对象继续工作。</p>
        </div>
        <div class="workspace-header-actions" id="workspace-header-actions" aria-live="polite"></div>
      </header>

      <section class="main view-chat" id="view-chat">
        <div class="chat-context workspace-card">
          <div class="main-title">
            <b id="chat-title">新对话</b>
            <span class="origin-wrap">
              <button class="origin" id="chat-origin" title="查看这次对话的来源">
                <svg><use href="#ic-eye" /></svg><span id="chat-origin-text">当前选区</span>
              </button>
              <span class="peek" role="tooltip" id="chat-peek" hidden>
                <span class="peek-top"><svg><use href="#ic-eye" /></svg>来源<em id="peek-label">选区预览</em></span>
                <img id="peek-image" class="peek-img" alt="划线选区预览" />
              </span>
            </span>
          </div>
        </div>
        <div class="stream workspace-card" id="stream">
          <div class="chat-blank"><p>还没有对话。</p><p class="sub">在屏幕上划过内容，然后直接输入你的要求。</p></div>
        </div>
        <div class="composer-wrap">
          <form class="workspace-composer">
            <textarea rows="2" maxlength="12000" placeholder="继续问，或描述你想完成的事…" aria-label="继续对话"></textarea>
            <div class="composer-bar">
              <span class="composer-context-label"><svg><use href="#ic-target" /></svg>当前对象</span>
              <span class="spacer"></span>
              <span class="model-label"><svg><use href="#ic-spark" /></svg>默认模型</span>
              <button type="submit" class="send-btn" title="发送"><svg><use href="#ic-send" /></svg></button>
            </div>
          </form>
        </div>
      </section>

      <section class="main" id="view-stash" hidden>
        <div class="page-toolbar workspace-card">
          <span class="pill" id="stash-count">0 项</span>
          <div class="seg-toggle" id="stash-mode"><button class="is-on" data-mode="canvas">画布</button><button data-mode="list">列表</button></div>
        </div>
        <div class="stash-filters" aria-label="收藏分类">
          <button class="tab is-on" data-kind="">全部</button><button class="tab" data-kind="灵感">灵感</button>
          <button class="tab" data-kind="交接">交接</button><button class="tab" data-kind="凭证">凭证</button>
          <button class="tab" data-kind="素材">素材</button><button class="tab" data-kind="片段">片段</button>
        </div>
        <div class="canvas workspace-card" id="canvas">
          <div class="canvas-rail">
            <button class="crail-btn is-on" title="选择"><svg><use href="#ic-cursor" /></svg></button>
            <button class="crail-btn" title="回到全部" id="canvas-fit"><svg><use href="#ic-target" /></svg></button>
          </div>
          <div class="canvas-world" id="canvas-world"></div>
          <div class="canvas-zoom"><button id="zoom-out">−</button><span id="zoom-val">100%</span><button id="zoom-in">＋</button></div>
        </div>
        <div class="stash-list workspace-card" id="stash-list" hidden></div>
      </section>

      <section class="main" id="view-timeline" hidden><div class="tl workspace-card" id="tl"></div></section>
      <section class="main" id="view-memory" hidden><div class="view-body workspace-card" id="mem-list"></div></section>
      <section class="main" id="view-artifacts" hidden><div class="view-body workspace-card" id="art-list"></div></section>

      <section class="main set" id="view-settings" hidden>
        <div class="settings-layout workspace-card">
          <nav class="set-nav" id="set-nav" aria-label="设置分类"></nav>
          <div class="set-body" id="set-body"></div>
        </div>
        <div id="settings-save-status" class="settings-save-status" data-state="idle" role="status" aria-live="polite"></div>
      </section>
    </div>

    <aside class="aux" id="aux" hidden>
      <header class="aux-top">
        <div><p class="workspace-eyebrow">ARTIFACT PREVIEW</p><b>产物预览</b></div>
        <button class="icon-btn is-plain" id="aux-close" aria-label="关闭预览"><svg><use href="#ic-x" /></svg></button>
      </header>
      <div class="aux-body"><div class="doc"><h2>本地产物</h2><p>从对话或产物页选择一个项目后，会在这里显示完整内容。</p></div></div>
    </aside>
  </div>

  <script src="icons.js?v=22"></script>
  <script src="../cards.js?v=22"></script>
  <script src="../studio_shell.js?v=22"></script>
  <script src="card_render.js?v=22"></script>
  <script src="live_cards.js?v=22"></script>
  <script src="data.js?v=22"></script>
  <script src="settings_model.js?v=22"></script>
  <script src="settings.js?v=22"></script>
  <script src="studio.js?v=22"></script>
</body>
</html>
