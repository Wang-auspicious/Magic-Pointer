<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Pointer</title>
  <link rel="stylesheet" href="oreo_tokens.css?v=23" />
  <link rel="stylesheet" href="oreo.css?v=23" />
  <link rel="stylesheet" href="cards.css?v=23" />
  <link rel="stylesheet" href="dsh_tokens.css?v=23" />
  <link rel="stylesheet" href="dsh_chat.css?v=23" />
  <link rel="stylesheet" href="studio.css?v=23" />
  <link rel="stylesheet" href="dsh_web.css?v=23" />
</head>
<body class="studio">
  <!-- DSH Web 外壳（AppFrame 三栏 → 侧栏 | 中心列），100% 移植 deepseek-harness -->
  <div class="dshw-frame" id="shell" data-view="chat">
    <aside class="dshw-sidebar-col">
      <div class="dshw-sidebar">
        <div class="dshw-logo-row">
          <button class="dshw-brand" data-goto="chat" aria-label="Magic Pointer 对话">
            <span class="dshw-brand-mark" aria-hidden="true">MP</span>
            <span>Magic Pointer</span>
          </button>
          <button class="dshw-icon-button" id="sidebar-toggle" aria-label="折叠侧栏" title="折叠侧栏">
            <svg aria-hidden="true"><use href="#ic-dsh-panel-left" /></svg>
          </button>
        </div>

        <button class="dshw-new-session" id="new-chat" data-goto="chat">
          <svg aria-hidden="true"><use href="#ic-dsh-new-chat" /></svg><span class="dshw-new-session-label">新对话</span>
        </button>

        <section class="dshw-workspace-browser" aria-label="对话浏览器">
          <div class="dshw-workspace-header">
            <span class="dshw-workspace-label">工作区</span>
            <div class="dshw-workspace-search">
              <button type="button" class="dshw-workspace-search-button" id="side-search-toggle"
                aria-label="搜索对话" aria-expanded="false" title="搜索对话">
                <svg aria-hidden="true"><use href="#ic-dsh-search" /></svg>
              </button>
              <input id="side-search" type="search" autocomplete="off" placeholder="搜索对话" aria-label="搜索对话" />
              <button type="button" class="dshw-workspace-clear" id="side-search-clear"
                aria-label="清除搜索" title="清除搜索" hidden>
                <svg aria-hidden="true"><use href="#ic-x" /></svg>
              </button>
            </div>
            <button type="button" class="dshw-workspace-action" id="workspace-filter"
              aria-label="筛选工作区" title="筛选工作区">
              <svg aria-hidden="true"><use href="#ic-dsh-personalization" /></svg>
            </button>
            <button type="button" class="dshw-workspace-action" id="workspace-add"
              aria-label="新建对话" title="新建对话">
              <svg aria-hidden="true"><use href="#ic-dsh-project-add" /></svg>
            </button>
          </div>
          <div class="dshw-session-list-seat">
            <div id="side-convos"></div>
          </div>
        </section>

        <div class="dshw-foot">
          <button class="dshw-trigger" data-goto="settings" aria-haspopup="dialog">
            <svg aria-hidden="true"><use href="#ic-dsh-settings" /></svg><span>设置</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="dshw-center-col">
      <!-- 工作区页头：聊天之外各页的标题（show() 写入） -->
      <header class="workspace-header" id="workspace-header">
        <div>
          <p class="workspace-eyebrow" id="workspace-eyebrow">ACTIVE WORK</p>
          <h1 id="workspace-title">对话</h1>
          <p class="workspace-description" id="workspace-description">围绕刚才指过的对象继续工作。</p>
        </div>
        <div class="workspace-header-actions" id="workspace-header-actions" aria-live="polite"></div>
      </header>

      <!-- ===== 对话页：DSH ConversationRoot（header + 滚动体 + 底部粘性输入卡 + 统计行） ===== -->
      <section class="dshw-conversation" id="view-chat">
        <header class="dshw-header">
          <div class="dshw-title-row">
            <div class="dshw-title-cluster">
              <b class="dshw-title" id="chat-title">新对话</b>
              <span class="dshw-agent-preset" title="标准模式">
                <svg class="dshw-agent-preset-icon" width="14" height="14" aria-hidden="true"><use href="#ic-dsh-agent-preset" /></svg><span>标准模式</span>
              </span>
            </div>
            <div class="dshw-header-actions">
              <div class="dshw-source-preview" id="chat-source-preview" hidden>
                <button type="button" class="dshw-source-thumb" id="chat-origin"
                  aria-label="预览划线选区" aria-describedby="chat-peek">
                  <img id="chat-source-thumb" alt="划线选区缩略图" />
                </button>
                <span class="dshw-peek" role="tooltip" id="chat-peek" hidden>
                  <span class="peek-top"><svg><use href="#ic-eye" /></svg>来源<em id="peek-label">选区预览</em></span>
                  <img id="peek-image" class="peek-img" alt="划线选区预览" />
                </span>
              </div>
              <div class="dshw-surface" id="mp-surface-menu">
                <button type="button" class="dshw-origin" id="mp-context-tag" aria-label="上下文与 Magic Pointer 工具"
                  aria-haspopup="menu" aria-expanded="false">
                  <span class="dshw-context-dot" aria-hidden="true"></span><span id="mp-context-tag-label">Magic Pointer</span>
                  <svg class="dshw-origin-chev"><use href="#ic-dsh-chev-down" /></svg>
                </button>
                <div class="dshw-surface-menu" id="mp-surface-menu-popover" role="menu" hidden>
                  <button role="menuitem" data-goto="stash"><svg><use href="#ic-stash" /></svg><span>收藏箱</span></button>
                  <button role="menuitem" data-goto="timeline"><svg><use href="#ic-timeline" /></svg><span>时间线</span></button>
                  <button role="menuitem" data-goto="memory"><svg><use href="#ic-memory" /></svg><span>记忆</span></button>
                  <button role="menuitem" data-goto="artifacts"><svg><use href="#ic-docs" /></svg><span>产物</span></button>
                </div>
              </div>
              <button type="button" class="dshw-session-log" id="session-log">
                <span>Session log</span><svg aria-hidden="true"><use href="#ic-dsh-download" /></svg>
              </button>
            </div>
          </div>
          <nav class="dshw-conversation-tabs" aria-label="对话视图">
            <button class="is-on" data-conversation-tab="chat" aria-selected="true">对话</button>
            <button data-conversation-tab="trajectory" aria-selected="false">轨迹</button>
          </nav>
        </header>

        <div class="dshw-scrollbody">
          <button type="button" class="dshw-scroll-pill" id="scroll-pill" hidden aria-label="回到底部">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 11.5L2.5 6l1-1L8 9.5 12.5 5l1 1z" fill="currentColor"/></svg>
          </button>
          <div class="dshw-stream" id="stream">
            <div class="dshw-blank"><p>还没有对话。</p><p class="sub">在屏幕上划过内容，然后直接输入你的要求。</p></div>
          </div>
          <div class="dshw-trajectory-seat" id="trajectory" hidden></div>

          <div class="dshw-plan" id="composer-plan" hidden>
            <button type="button" class="dshw-plan-head" id="composer-plan-toggle" aria-expanded="true">
              <svg class="dshw-plan-chev" width="12" height="12" aria-hidden="true"><use href="#ic-dsh-chev-down" /></svg>
              <span class="dshw-plan-title" id="composer-plan-title">计划</span>
              <span class="dshw-plan-count" id="composer-plan-count"></span>
            </button>
            <ol class="dshw-plan-steps" id="composer-plan-steps"></ol>
          </div>
          <div class="dshw-perm-ask" id="composer-permission-ask" hidden role="group" aria-label="权限请求"></div>
          <div class="dshw-composer-seat">
            <div class="dshw-composer-stack">
              <form class="dshw-input-form" id="composer-form">
                <div class="dshw-input-root">
                  <div class="dshw-card">
                    <div class="dshw-scroll">
                      <div class="dshw-grow">
                        <textarea class="dshw-input" rows="2" maxlength="12000"
                          placeholder="继续问，或描述你想完成的事…" aria-label="继续对话"></textarea>
                      </div>
                    </div>
                    <div class="dshw-row">
                      <div class="dshw-tools">
                        <button type="button" class="dshw-add" id="composer-add" aria-label="命令与技能" aria-haspopup="menu" aria-expanded="false" title="命令与技能">
                          <svg width="14" height="14" aria-hidden="true"><use href="#ic-dsh-plus" /></svg>
                        </button>
                        <div class="dshw-add-menu dshw-slash-menu" id="composer-add-menu" hidden role="menu" aria-label="命令与技能">
                          <input type="search" id="composer-slash-search" placeholder="搜索命令与技能…" autocomplete="off" aria-label="搜索命令与技能" />
                          <div class="dshw-slash-rows" id="composer-slash-rows"></div>
                        </div>
                        <button type="button" class="dshw-perm" id="composer-workspace" title="编码工作区：agent 在这个目录里读写与执行（点击选择文件夹）">
                          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 1.8H13A1.5 1.5 0 0 1 14.5 6.3v5.2A1.5 1.5 0 0 1 13 13H3a1.5 1.5 0 0 1-1.5-1.5v-7Z" stroke="currentColor" stroke-width="1.2"/></svg>
                          <span class="dshw-perm-label" id="composer-workspace-label">工作区</span>
                        </button>
                        <button type="button" class="dshw-perm" id="composer-style" aria-haspopup="listbox" aria-expanded="false" title="回复风格：控制 AI 回复的详细程度（极简/简洁/正常/古典）">
                          <span class="dshw-perm-glyph" id="composer-style-glyph" aria-hidden="true"></span>
                          <span class="dshw-perm-label" id="composer-style-label">正常</span>
                          <svg class="dshw-perm-chev" width="12" height="12" aria-hidden="true"><use href="#ic-dsh-chev-down" /></svg>
                        </button>
                        <div class="dshw-perm-menu" id="composer-style-menu" hidden role="listbox" aria-label="回复风格"></div>
                        <button type="button" class="dshw-perm" id="composer-permission" aria-haspopup="listbox" aria-expanded="false" title="本轮 Agent 的权限预设">
                          <span class="dshw-perm-glyph" id="composer-permission-glyph" aria-hidden="true"></span>
                          <span class="dshw-perm-label" id="composer-permission-label">工作区写入</span>
                          <svg class="dshw-perm-chev" width="12" height="12" aria-hidden="true"><use href="#ic-dsh-chev-down" /></svg>
                        </button>
                        <div class="dshw-perm-menu" id="composer-permission-menu" hidden role="listbox" aria-label="权限预设"></div>
                      </div>
                      <div class="dshw-trailing">
                        <button type="button" class="dshw-perm dshw-model" id="composer-model" aria-haspopup="listbox" aria-expanded="false" title="模型">
                          <span class="dshw-perm-label" id="composer-model-label">默认模型</span>
                          <svg class="dshw-perm-chev" width="12" height="12" aria-hidden="true"><use href="#ic-dsh-chev-down" /></svg>
                        </button>
                        <div class="dshw-model-menu" id="composer-model-menu" hidden role="listbox" aria-label="模型目录"></div>
                        <button type="button" class="dshw-ring" id="composer-context" aria-label="上下文占用" title="上下文占用（暂无数据）">
                          <svg viewBox="0 0 28 28" width="18" height="18" aria-hidden="true">
                            <circle class="dshw-ring-track" cx="14" cy="14" r="8" />
                            <circle class="dshw-ring-fill" cx="14" cy="14" r="8" />
                          </svg>
                        </button>
                        <button type="submit" class="dshw-primary" title="发送" aria-label="发送">
                          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                            <path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="dshw-stats" id="stats-line" role="status"></div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 收藏箱（保留原画布/列表机制，外壳换 DSH 令牌） ===== -->
      <section class="dshw-view" id="view-stash" hidden>
        <div>
          <h2>收藏箱</h2>
          <p class="desc">划过之后复制、截图与素材都留在这里。</p>
        </div>
        <div class="page-toolbar">
          <span class="pill" id="stash-count">0 项</span>
          <div class="dshw-seg" id="stash-mode"><button class="is-on" data-mode="canvas">画布</button><button data-mode="list">列表</button></div>
        </div>
        <div class="stash-filters" aria-label="收藏分类">
          <button class="dshw-tab is-on" data-kind="">全部</button><button class="dshw-tab" data-kind="灵感">灵感</button>
          <button class="dshw-tab" data-kind="交接">交接</button><button class="dshw-tab" data-kind="凭证">凭证</button>
          <button class="dshw-tab" data-kind="素材">素材</button><button class="dshw-tab" data-kind="片段">片段</button>
        </div>
        <div class="canvas" id="canvas">
          <div class="canvas-rail">
            <button class="crail-btn" title="回到全部" id="canvas-fit"><svg><use href="#ic-target" /></svg></button>
          </div>
          <div class="canvas-world" id="canvas-world"></div>
          <div class="canvas-zoom"><button id="zoom-out">−</button><span id="zoom-val">100%</span><button id="zoom-in">＋</button></div>
        </div>
        <div class="stash-list" id="stash-list" hidden></div>
      </section>

      <section class="dshw-view" id="view-timeline" hidden><div class="tl" id="tl"></div></section>
      <section class="dshw-view" id="view-memory" hidden><div class="view-body" id="mem-list"></div></section>
      <section class="dshw-view" id="view-artifacts" hidden><div class="view-body" id="art-list"></div></section>

      <!-- ===== 设置：DSH SettingsRoot 居中模态（点击侧栏「设置」打开） ===== -->
      <section id="view-settings" hidden>
        <div class="dshw-settings-overlay" role="dialog" aria-modal="true" aria-label="设置">
          <div class="dshw-settings-mask" data-settings-close aria-hidden="true"></div>
          <div class="dshw-settings-panel">
            <nav class="dshw-settings-nav" aria-label="设置分类">
              <div class="dshw-settings-nav-title">设置</div>
              <label class="dshw-settings-search">
                <svg aria-hidden="true"><use href="#ic-dsh-search" /></svg>
                <input id="settings-search" type="search" autocomplete="off" placeholder="搜索设置" aria-label="搜索设置" />
              </label>
              <div class="dshw-settings-nav-list" id="set-nav"></div>
            </nav>
            <div class="dshw-settings-content">
              <div class="dshw-settings-header">
                <span></span>
                <button class="dshw-settings-close" data-settings-close aria-label="关闭设置">
                  <svg aria-hidden="true"><use href="#ic-x" /></svg>
                </button>
              </div>
              <div class="dshw-settings-options" id="set-body"></div>
            </div>
          </div>
        </div>
        <div id="settings-save-status" class="settings-save-status" data-state="idle" role="status" aria-live="polite"></div>
      </section>
    </main>

    <aside class="aux" id="aux" hidden>
      <header class="aux-top">
        <div><p class="workspace-eyebrow">ARTIFACT PREVIEW</p><b>产物预览</b></div>
        <button class="icon-btn is-plain" id="aux-close" aria-label="关闭预览"><svg><use href="#ic-x" /></svg></button>
      </header>
      <div class="aux-body"><div class="doc"><h2>本地产物</h2><p>从对话或产物页选择一个项目后，会在这里显示完整内容。</p></div></div>
    </aside>
  </div>

  <script src="icons.js?v=23"></script>
  <script src="../cards.js?v=23"></script>
  <script src="../studio_shell.js?v=23"></script>
  <script src="card_render.js?v=23"></script>
  <script src="live_cards.js?v=23"></script>
  <script src="dsh_markdown.js?v=24"></script>
  <script src="dsh_icons.js?v=25"></script>
  <script src="dsh_chat.js?v=25"></script>
  <script src="dsh_trajectory.js?v=25"></script>
  <script src="../conversation_control.js?v=23"></script>
  <script src="../slash_trigger.js?v=23"></script>
  <script src="permission_presets.js?v=23"></script>
  <script src="sidebar_groups.js?v=23"></script>
  <script src="data.js?v=23"></script>
  <script src="settings_model.js?v=23"></script>
  <script src="settings.js?v=23"></script>
  <script src="studio.js?v=25"></script>
</body>
</html>
