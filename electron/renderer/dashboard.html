<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Pointer</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Magic Pointer 导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Magic Pointer</span>
      </div>
      <nav>
        <button class="nav-item is-active" type="button" aria-current="page">
          <span class="nav-icon" aria-hidden="true">✓</span>
          <span>购物清单</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" aria-hidden="true"></span>
        <span>本地动作已连接</span>
      </div>
    </aside>

    <main class="workspace" data-view="shopping-list">
      <header class="topbar">
        <div>
          <p class="eyebrow">ACTION SPACE</p>
          <h1>购物清单</h1>
        </div>
        <button id="dashboard-close" class="icon-button" type="button" aria-label="关闭 Dashboard" title="关闭">×</button>
      </header>

      <section class="summary" aria-label="清单概览">
        <div class="summary-copy">
          <p id="summary-label">准备好添加第一件商品</p>
          <span>在任意应用选中文字，然后告诉 Magic Pointer“添加这个”。</span>
        </div>
        <div class="summary-count" aria-live="polite">
          <strong id="remaining-count">0</strong>
          <span>待完成</span>
        </div>
      </section>

      <section class="list-card" aria-labelledby="list-title">
        <div class="list-card-head">
          <div>
            <h2 id="list-title">我的清单</h2>
            <p id="list-meta">所有更改都会在本机即时保存</p>
          </div>
          <button id="dashboard-refresh" class="quiet-button" type="button">刷新</button>
        </div>

        <div id="dashboard-notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="shopping-items" class="shopping-items" aria-live="polite"></div>
        <div id="shopping-empty" class="empty-state">
          <div class="empty-illustration" aria-hidden="true">
            <span>✓</span>
          </div>
          <h3>清单还是空的</h3>
          <p>选中“牛奶”“咖啡豆”或任何短文本，唤起 Magic Pointer 后说“添加这个”。</p>
          <div class="shortcut-hint" aria-label="快捷键 Ctrl Alt M">
            <kbd>Ctrl</kbd><span>+</span><kbd>Alt</kbd><span>+</span><kbd>M</kbd>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
