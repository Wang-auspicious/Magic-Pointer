<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Magic Pointer Overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="trail"></canvas>
  <div id="hint" class="hint">Magic Pointer 已就绪</div>
  <div id="pill" class="pill hidden">
    <div class="context-mark" aria-hidden="true">⌁</div>
    <textarea id="command" rows="1" autocomplete="off" spellcheck="false" placeholder="描述问题或期望，不需要找源码"></textarea>
    <button id="dictation" class="pill-dictation" title="系统听写" aria-label="系统听写"><span aria-hidden="true"></span></button>
    <button id="run" title="Run">&crarr;</button>
  </div>
  <div id="result" class="result hidden"></div>
  <script src="overlay.js"></script>
</body>
</html>
