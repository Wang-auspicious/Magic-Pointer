<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Magic Pointer CU Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 14px;
      border-radius: 999px;
      background: rgba(20, 20, 19, 0.92);
      color: #f7f6f3;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      -webkit-app-region: drag;
      max-width: 100%;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #d97757;
      flex: none;
      animation: pulse 1.5s infinite;
    }
    .dot.is-rec { background: #ef4444; }
    .dot.is-paused { background: #f59e0b; animation: none; }
    .dot.is-thinking { background: #60a5fa; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .text-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .label {
      font-size: 12.5px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .sub {
      font-size: 11px;
      line-height: 1.2;
      color: rgba(247, 246, 243, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .sub[hidden] { display: none; }
    .muted { color: rgba(247, 246, 243, 0.65); }
    .actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
      flex: none;
    }
    button {
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #f7f6f3;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
    button.is-primary {
      background: #d97757;
      border-color: #d97757;
      color: #fff;
    }
    button.is-primary:hover { background: #c6613f; }
    button.is-danger {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot" id="dot"></span>
    <div class="text-col">
      <span class="label" id="label">准备就绪</span>
      <span class="sub" id="sub" hidden></span>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <script>
    const dotEl = document.getElementById('dot');
    const labelEl = document.getElementById('label');
    const subEl = document.getElementById('sub');
    const actionsEl = document.getElementById('actions');
    const bridge = window.magicPointerDashboard && window.magicPointerDashboard.cuOverlay;

    function send(action) {
      if (bridge && typeof bridge.action === 'function') {
        bridge.action(action);
      }
    }

    function btn(text, action, cls) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      if (cls) b.className = cls;
      b.addEventListener('click', () => send(action));
      return b;
    }

    function render(state) {
      if (!state) return;
      dotEl.className = 'dot';
      subEl.hidden = true;
      subEl.textContent = '';
      actionsEl.replaceChildren();
      if (state.mode === 'autopilot') {
        const isThinking = state.phase === 'thinking';
        if (state.paused) dotEl.classList.add('is-paused');
        else if (isThinking) dotEl.classList.add('is-thinking');
        const win = state.windowTitle ? state.windowTitle + ' · ' : '';
        const prefix = state.paused
          ? '已接管 · '
          : isThinking
            ? 'AI 思考中 · '
            : 'AI 操作中 · ';
        labelEl.textContent = prefix + win + (state.actionLabel || '');
        if (state.nextStep) {
          subEl.textContent = '下一步：' + state.nextStep;
          subEl.hidden = false;
        }
        actionsEl.append(
          btn(state.paused ? '继续 AI' : '暂停/接管', state.paused ? 'resume' : 'takeover', 'is-primary'),
          btn('切为指点', 'coach'),
          btn('停止', 'stop', 'is-danger')
        );
      } else if (state.mode === 'teach') {
        const steps = Array.isArray(state.teachSteps) ? state.teachSteps : [];
        const cur = steps[state.teachIndex];
        labelEl.textContent = `带练 ${state.teachIndex + 1}/${steps.length} · ${(cur && cur.label) || ''}`;
        if (state.teachIndex > 0) actionsEl.append(btn('上一步', 'teach-prev'));
        actionsEl.append(btn('帮我点这步', 'teach-execute', 'is-primary'));
        if (state.teachIndex < steps.length - 1) actionsEl.append(btn('下一步', 'teach-next'));
        actionsEl.append(btn('退出', 'teach-exit'));
      } else if (state.mode === 'record') {
        dotEl.classList.add('is-rec');
        const count = Array.isArray(state.recordedSteps) ? state.recordedSteps.length : 0;
        labelEl.textContent = `示范录制中 · 已录 ${count} 步`;
        actionsEl.append(
          btn('记当前步', 'record-step', 'is-primary'),
          btn('完成生成教程', 'record-finish'),
          btn('丢弃', 'record-discard', 'is-danger')
        );
      }
    }

    if (bridge && typeof bridge.onState === 'function') {
      bridge.onState(render);
    }
  </script>
</body>
</html>
