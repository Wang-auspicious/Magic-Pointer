<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Pointer Stage</title>
    <link rel="stylesheet" href="stage.css" />
    <link rel="stylesheet" href="typography.css" />
  </head>
  <body>
    <main id="stage" class="stage-root" data-state="hidden" hidden aria-label="Magic Pointer 舞台">
      <div id="targeting-outline" class="targeting-outline" hidden></div>
      <div id="frozen-glow" class="frozen-glow" hidden></div>
      <div id="capsule" class="stage-capsule" data-mode="voice" data-phase="input" hidden>
        <span id="capsule-count" class="capsule-count" hidden></span>
        <span id="voice-waveform" class="voice-waveform" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <input
          id="capsule-input"
          class="capsule-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-label="对锁定对象下达命令"
        />
        <p id="transcript" class="capsule-transcript" aria-live="polite"></p>
        <span id="processing-shimmer" class="processing-shimmer" aria-hidden="true" hidden></span>
      </div>
      <div id="stage-chips" class="stage-chips" role="group" aria-label="建议操作" hidden></div>
      <section id="stage-thread" class="stage-thread" aria-label="本次会话" hidden>
        <div id="stage-result" class="stage-result" role="log" aria-live="polite"></div>
        <footer class="thread-bar">
          <span id="thread-count" class="thread-count"></span>
          <button type="button" id="thread-copy" class="thread-tool">复制</button>
          <button type="button" id="thread-close" class="thread-tool is-close">关闭</button>
        </footer>
      </section>
      <div id="stage-error" class="stage-error" role="alert" hidden></div>
      <div id="delivery-progress" class="delivery-progress" hidden>
        <span id="delivery-label" class="delivery-label"></span>
        <span class="delivery-track" aria-hidden="true"><i id="delivery-bar" class="delivery-bar"></i></span>
        <span id="delivery-count" class="delivery-count"></span>
      </div>
    </main>

    <!-- Structured result card skeletons (inert templates, cloned by stage.js). -->
    <template id="tpl-thread-turn">
      <article class="thread-turn" data-status="pending">
        <p class="turn-ask"></p>
        <div class="turn-answer"></div>
      </article>
    </template>
    <template id="tpl-turn-wait">
      <div class="turn-wait" aria-label="正在处理">
        <i></i><i></i><i></i>
        <span class="turn-elapsed"></span>
      </div>
    </template>
    <template id="tpl-calendar-draft">
      <div class="result-card card-calendar">
        <p class="card-title"></p>
        <p class="card-row card-time"></p>
        <p class="card-row card-location"></p>
        <p class="card-row card-conflict" hidden></p>
        <p class="card-status" data-status="draft"></p>
      </div>
    </template>
    <template id="tpl-table-compare">
      <div class="result-card card-table">
        <p class="card-title card-sources"></p>
        <p class="card-row compare-counts">
          <span class="count-added"></span>
          <span class="count-removed"></span>
          <span class="count-changed"></span>
        </p>
        <table class="compare-table"><tbody></tbody></table>
      </div>
    </template>
    <template id="tpl-text-draft">
      <div class="result-card card-text">
        <p class="card-title"></p>
        <p class="card-diff"></p>
      </div>
    </template>
    <template id="tpl-agent-prompt-draft">
      <div class="agent-prompt-draft">
        <textarea class="agent-prompt-editor" maxlength="60000" spellcheck="false" aria-label="可编辑的 Agent Prompt"></textarea>
        <p class="agent-prompt-note" hidden></p>
        <div class="agent-session-row" role="radiogroup" aria-label="正在运行的 Agent 会话"></div>
        <div class="agent-prompt-actions">
          <button type="button" class="agent-prompt-close">关闭</button>
          <button type="button" class="agent-prompt-confirm" disabled>确认</button>
        </div>
      </div>
    </template>

    <script src="../stage_state.js"></script>
    <script src="../stage_anchor.js"></script>
    <script src="../stage_chips_policy.js"></script>
    <script src="../stage_hit_policy.js"></script>
    <script src="../voice_trigger_policy.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
