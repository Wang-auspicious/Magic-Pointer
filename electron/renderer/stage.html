<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file: http: https:; frame-src 'self' https:; media-src 'self' data: file: https:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Pointer Stage</title>
    <link rel="stylesheet" href="oreo_tokens.css" />
    <link rel="stylesheet" href="theme_tokens.css" />
    <link rel="stylesheet" href="chat_styles.css" />
    <link rel="stylesheet" href="decision_card.css" />
    <link rel="stylesheet" href="stage.css" />
    <link rel="stylesheet" href="cards.css" />
    <link rel="stylesheet" href="beam.css" />
    <link rel="stylesheet" href="typography.css" />
  </head>
  <body>
    <main id="stage" class="stage-root" data-state="hidden" hidden aria-label="Magic Pointer 舞台">
      <div id="targeting-outline" class="targeting-outline" hidden></div>
      <div id="capture-proof" class="capture-proof" aria-hidden="true" hidden></div>
      <div id="screen-points" class="screen-points" aria-hidden="true" hidden></div>
      <div id="selection-stretch" class="selection-stretch" hidden>
        <div class="selection-stretch-handle" data-edge="top" data-no-drag="1"></div>
        <div class="selection-stretch-handle" data-edge="bottom" data-no-drag="1"></div>
        <span id="selection-stretch-hint" class="selection-stretch-hint" aria-live="polite"></span>
      </div>
      <div id="frozen-glow" class="frozen-glow" hidden></div>
      <div id="capsule" class="stage-composer" data-mode="text" data-phase="input" data-drag-handle="1" hidden>
        <div class="composer-context" aria-label="当前上下文">
          <span class="stage-brand" aria-hidden="true">MP</span>
          <span class="composer-context-label">已锁定当前对象</span>
          <span id="capsule-count" class="capsule-count" hidden></span>
          <span id="capsule-refs" class="capsule-refs" role="list" aria-label="已选中的对象" hidden></span>
        </div>
        <div class="composer-input-row">
          <input
            id="capsule-input"
            class="capsule-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            data-no-drag="1"
            aria-label="对锁定对象下达命令"
          />
          <p id="transcript" class="capsule-transcript" aria-live="polite"></p>
          <button type="button" id="capsule-send" class="capsule-send" data-no-drag="1" aria-label="提交">
            <svg class="capsule-send-icon" aria-hidden="true"><use href="#ic-arrow-up" /></svg>
            <svg class="capsule-stop-icon" aria-hidden="true"><use href="#ic-stop" /></svg>
          </button>
        </div>
        <div class="composer-tools" aria-hidden="true">
          <span class="composer-mode-label">键盘输入</span>
          <span class="composer-grounding-label">画面已冻结</span>
        </div>
        <span id="processing-shimmer" class="processing-shimmer" aria-hidden="true" hidden></span>
      </div>
      <div id="stage-chips" class="stage-chips" role="group" aria-label="建议操作" hidden></div>
      <div id="stage-notice" class="stage-notice" role="status" hidden><span id="stage-notice-text"></span></div>
      <section id="stage-thread" class="stage-thread" aria-label="本次会话" hidden>
        <header class="thread-head" data-drag-handle="1">
          <div class="thread-head-row">
            <b id="thread-title" class="thread-title"></b>
            <span id="thread-eyebrow" class="thread-eyebrow" data-state="done">
              <svg aria-hidden="true"><use href="#ic-check" /></svg><em id="thread-eyebrow-text">已完成</em>
            </span>
            <span class="thread-head-spacer"></span>
            <button type="button" id="thread-stop" class="thread-icon" data-no-drag="1"
                    aria-label="停止任务" title="停止任务" hidden>
              <svg class="thread-stop-icon" aria-hidden="true"><use href="#ic-stop" /></svg>
            </button>
            <button type="button" id="thread-close" class="thread-icon is-close" data-no-drag="1"
                    aria-label="关闭" title="关闭">
              <svg class="thread-close-icon" aria-hidden="true"><use href="#ic-x" /></svg>
            </button>
          </div>
        </header>
        <div class="work-panel-viewport">
          <div class="work-panel-scroller">
            <div id="stage-result" class="stage-result" role="log" aria-live="polite"></div>
            <div id="stage-decision" data-no-drag="1" hidden></div>
          </div>
        </div>
        <div id="capsule-consent" class="capsule-consent" role="group" aria-label="要不要写出去" hidden>
          <span id="consent-target" class="consent-target"></span>
          <button type="button" id="consent-reject" class="thread-btn" data-no-drag="1">拒绝</button>
          <button type="button" id="consent-approve" class="thread-btn is-solid" data-no-drag="1">同意</button>
        </div>
        <button type="button" id="passage-expand" class="passage-expand" data-no-drag="1" hidden
                aria-label="把选中的这段展开讲">
          <svg aria-hidden="true"><use href="#ic-expand" /></svg><span>展开讲讲</span>
        </button>
        <footer class="thread-bar" data-drag-handle="1">
          <button type="button" id="thread-retry" class="thread-icon" data-no-drag="1"
                  aria-label="重问一次" title="重问一次">
            <svg aria-hidden="true"><use href="#ic-redo" /></svg>
          </button>
          <input type="text" id="thread-followup" class="thread-followup" data-no-drag="1"
                 autocomplete="off" spellcheck="false" aria-label="继续追问" />
          <span id="thread-count" class="thread-count"></span>
          <button type="button" id="thread-copy" class="thread-icon" data-no-drag="1"
                  aria-label="复制" title="复制">
            <svg aria-hidden="true"><use href="#ic-copy" /></svg>
          </button>
          <button type="button" id="thread-send" class="thread-send" data-no-drag="1" aria-label="发送追问">
            <svg aria-hidden="true"><use href="#ic-arrow-up" /></svg>
          </button>
        </footer>
      </section>
      <div id="stage-error" class="stage-error" role="alert" hidden></div>
      <div id="delivery-progress" class="delivery-progress" hidden>
        <span id="delivery-label" class="delivery-label"></span>
        <span class="delivery-track" aria-hidden="true"><i id="delivery-bar" class="delivery-bar"></i></span>
        <span id="delivery-count" class="delivery-count"></span>
      </div>
    </main>

    <template id="tpl-thread-turn">
      <article class="thread-turn" data-status="pending">
        <p class="turn-ask"></p>
        <div class="turn-answer"></div>
      </article>
    </template>
    <template id="tpl-turn-wait">
      <div class="turn-wait" aria-label="正在处理">
        <i></i><i></i><i></i>
        <span class="turn-elapsed"></span>
      </div>
    </template>
    <template id="tpl-table-compare">
      <div class="result-card card-table">
        <p class="card-title card-sources"></p>
        <p class="card-row compare-counts">
          <span class="count-added"></span>
          <span class="count-removed"></span>
          <span class="count-changed"></span>
        </p>
        <table class="compare-table"><tbody></tbody></table>
      </div>
    </template>
    <template id="tpl-text-draft">
      <div class="result-card card-text">
        <p class="card-title"></p>
        <p class="card-diff"></p>
      </div>
    </template>
    <template id="tpl-agent-prompt-draft">
      <div class="agent-prompt-draft">
        <textarea class="agent-prompt-editor" maxlength="60000" spellcheck="false" aria-label="可编辑的 Agent Prompt"></textarea>
        <p class="agent-prompt-note" hidden></p>
        <div class="agent-session-row" role="radiogroup" aria-label="正在运行的 Agent 会话"></div>
        <div class="agent-prompt-actions">
          <button type="button" class="agent-prompt-close">关闭</button>
          <button type="button" class="agent-prompt-confirm" disabled>确认</button>
        </div>
      </div>
    </template>

    <script src="icons.js"></script>
    <script src="../answer_shape_policy.js"></script>
    <script src="../stage_state.js"></script>
    <script src="../conversation_control.js"></script>
    <script src="../stage_anchor.js"></script>
    <script src="../stage_surface_policy.js"></script>
    <script src="../stage_chips_policy.js"></script>
    <script src="../stage_stretch_policy.js"></script>
    <script src="../stage_pick_policy.js"></script>
    <script src="../capture_proof_policy.js"></script>
    <script src="../stage_turn_stream.js"></script>
    <script src="../task_sources.js"></script>
    <script src="../task_input_transport.js"></script>
    <script src="../stage_hit_policy.js"></script>
    <script src="../cards.js"></script>
    <script src="card_render.js"></script>
    <script src="chat_icons.js"></script>
    <script src="chat_markdown.js"></script>
    <script src="activity_marks.js"></script>
    <script src="chat_highlight.js"></script>
    <script src="chat_view.js"></script>
    <script src="decision_card.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
