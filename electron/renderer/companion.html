<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>Magic Pointer · 随行</title>
<link rel="stylesheet" href="oreo_tokens.css?v=20">
<link rel="stylesheet" href="oreo.css?v=20">
<link rel="stylesheet" href="cards.css?v=20">
<link rel="stylesheet" href="beam.css?v=20">
<link rel="stylesheet" href="composer.css?v=20">
<link rel="stylesheet" href="companion.css?v=14">
</head>
<body class="companion">

<header class="cp-top">
  <span class="orb" id="cp-orb"></span>
  <b id="cp-title">这段代码在干嘛？</b>
  <div class="cp-actions">
    <button class="icon-btn is-plain" title="历史"><svg><use href="#ic-hist"/></svg></button>
    <button class="icon-btn is-plain" title="新的一问"><svg><use href="#ic-plus"/></svg></button>
    <button class="icon-btn is-plain is-on" title="固定"><svg><use href="#ic-pin"/></svg></button>
    <button class="icon-btn is-plain" title="展开到工作室"><svg><use href="#ic-open"/></svg></button>
    <button class="icon-btn is-plain" title="关闭"><svg><use href="#ic-x"/></svg></button>
  </div>
</header>

<!-- ── 空态：三张提示卡，不是三行字 ── -->
<div class="cp-stream" id="cp-empty" hidden>
  <button class="card cp-suggest enter">
    <span class="tile pill-indigo"><svg><use href="#ic-spark"/></svg></span>
    <span class="side-text"><b>帮我解决这个问题</b><small>用当前窗口和选区作上下文</small></span>
  </button>
  <button class="card cp-suggest enter">
    <span class="tile pill-teal"><svg><use href="#ic-docs"/></svg></span>
    <span class="side-text"><b>总结</b><small>把这一屏压成三句话</small></span>
  </button>
  <button class="card cp-suggest enter">
    <span class="tile pill-amber"><svg><use href="#ic-eye"/></svg></span>
    <span class="side-text"><b>这是什么？</b><small>解释选中的内容或它的来处</small></span>
  </button>
</div>

<!-- ── 工作态：内容由 companion.js 从真实记录渲染，和工作室是同一份数据、
         同一个 renderCard。这里写死一份样例，就是上一版两个窗口对不上的原因。 ── -->
<div class="cp-stream" id="cp-stream"></div>

<div class="cp-foot">
  <div class="quick-chips">
    <button class="chip-sm"><svg><use href="#ic-spark"/></svg>解释一下</button>
    <button class="chip-sm"><svg><use href="#ic-docs"/></svg>总结</button>
    <button class="chip-sm"><svg><use href="#ic-search"/></svg>找出处</button>
  </div>
  <div id="cp-composer"></div>
</div>

<script src="icons.js?v=20"></script>
<script src="../cards.js?v=20"></script>
<script src="card_render.js?v=20"></script>
<script src="composer.js?v=20"></script>
<script src="live_cards.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="companion.js?v=20"></script>
</body>
</html>
