name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows ──────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.lock.txt

      - name: Verify source
        run: |
          npm test
          python -m pytest -q --basetemp "${{ runner.temp }}\magic-pointer-pytest"

      - name: Build installer
        run: npm run dist:win

      - name: Verify package
        run: |
          npm run verify:package
          npm run verify:installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  # ── macOS arm64 ──────────────────────────────────────────────────
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.lock.txt

      - name: Verify source
        run: |
          npm test
          python -m pytest -q --basetemp "$RUNNER_TEMP/magic-pointer-pytest"

      - name: Build native macOS host
        run: |
          swiftc -O -framework AppKit -framework ApplicationServices \
            native/macos/MagicPointerHost.swift \
            -o native/macos/magic-pointer-host

      - name: Prepare relocatable Python runtime
        run: bash scripts/prepare_python_runtime_macos.sh arm64

      - name: Build DMG
        run: |
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Building unsigned dev DMG (no CSC_LINK)"
          fi
          npx electron-builder --mac dmg zip --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  # ── macOS x64 ────────────────────────────────────────────────────
  macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.lock.txt

      - name: Verify source
        run: |
          npm test
          python -m pytest -q --basetemp "$RUNNER_TEMP/magic-pointer-pytest"

      - name: Build native macOS host
        run: |
          swiftc -O -framework AppKit -framework ApplicationServices \
            native/macos/MagicPointerHost.swift \
            -o native/macos/magic-pointer-host

      - name: Prepare relocatable Python runtime
        run: bash scripts/prepare_python_runtime_macos.sh x64

      - name: Build DMG
        run: |
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Building unsigned dev DMG (no CSC_LINK)"
          fi
          npx electron-builder --mac dmg zip --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  # ── Publish ──────────────────────────────────────────────────────
  publish:
    needs: [windows, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f -print0 | xargs -0 -I{} cp {} .
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Magic Pointer $GITHUB_REF_NAME" \
            ./*.exe ./*.dmg ./*.zip ./*.blockmap ./latest*.yml
