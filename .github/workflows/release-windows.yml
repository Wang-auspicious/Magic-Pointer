name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.lock.txt

      - name: Verify source
        run: |
          npm test
          python -m pytest -q --basetemp "${{ runner.temp }}\magic-pointer-pytest"

      - name: Build unsigned installer
        run: npm run dist:win

      - name: Verify packaged and installed products
        run: |
          npm run verify:package
          npm run verify:installer

      - name: Publish verified update
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            (Get-ChildItem 'release/*.exe').FullName
            (Resolve-Path 'release/latest.yml').Path
            (Get-ChildItem 'release/*.blockmap').FullName
          )
          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --generate-notes `
            --title "Magic Pointer $env:GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Pointer-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
