name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package to GitHub Releases
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.lock.txt

      - name: Verify source
        run: |
          npm test
          python -m pytest -q --basetemp "${{ runner.temp }}\magic-pointer-pytest"

      - name: Build unsigned installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish != true }}
        run: npm run dist:win

      - name: Build and publish update
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Pointer-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
