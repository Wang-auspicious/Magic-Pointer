repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(release|build|external|external_zip|data|node_modules)/'
      - id: end-of-file-fixer
        exclude: '^(release|build|external|external_zip|data|node_modules)/'
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '\.(js|mjs|cjs|json|yml|yaml|md|css|html)$'
        exclude: '^(release|build|external|external_zip|data|node_modules|package-lock\.json|requirements\.lock\.txt)/'
