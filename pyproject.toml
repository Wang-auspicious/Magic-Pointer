[project]
name = "magic-pointer"
version = "1.0.0"
description = "Magic Pointer - cross-platform AI pointer overlay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "external",
  "external_zip",
  "build",
  "release",
  "node_modules",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = [
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "B008",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "B011"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true
omit = ["tests/*", "external/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
