<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Pointer N11 Checkout Failure</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #111318; color: #f5f7fb; }
    main { padding: 72px 92px; }
    .eyebrow { color: #8ea5ff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 620px; font-size: 42px; line-height: 1.08; }
    .card { position: absolute; left: 520px; top: 300px; width: 360px; padding: 28px; border: 1px solid #343946; border-radius: 20px; background: #1b1e25; box-shadow: 0 18px 60px #0008; }
    button { width: 220px; height: 64px; border: 0; border-radius: 14px; background: #6e72ff; color: white; font: 700 18px system-ui; cursor: pointer; }
    #network-status { margin-top: 18px; color: #ff9b9b; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Controlled DevTools fixture</div>
    <h1>Payment could not reach the local API.</h1>
    <section class="card" aria-labelledby="failure-title">
      <h2 id="failure-title">Connection failed</h2>
      <button id="retry-payment" class="primary-action" data-testid="retry-payment" data-component="RetryPaymentButton" data-component-file="tests/fixtures/browser_devtools_issue.html" aria-label="Retry payment">Retry</button>
      <p id="network-status" role="status">Waiting for network failure…</p>
    </section>
  </main>
  <script>
    fetch('http://127.0.0.1:9/api/payment')
      .then(() => { document.getElementById('network-status').textContent = 'Unexpected response'; })
      .catch(error => {
        document.getElementById('network-status').textContent = `Network failed: ${error.name}`;
        console.error('N11 payment request failed', error);
      });
  </script>
</body>
</html>
