appId: com.magicpointer.desktop
productName: Magic Pointer
executableName: Magic Pointer
artifactName: Magic-Pointer-${version}-${arch}.${ext}

publish:
  provider: github
  owner: Wang-auspicious
  repo: Magic-Pointer

directories:
  output: release
  buildResources: packaging

# The Python bridge is launched as a separate process and therefore cannot read
# files inside app.asar. Keep the application tree unpacked until the bridge is
# changed to resolve resources outside the archive.
asar: false

# The only Node production runtime is pure JavaScript (electron-updater).
# Skipping native rebuild avoids an unnecessary and occasionally stalled pass.
npmRebuild: false

files:
  - build/electron/**
  - app/**
  # 运行时脚本白名单（2026-08-13 实测补全）：桥进程 spawn / import 的全部脚本。
  # 漏项会让安装版缺文件、首启自检失败（曾漏 recipe/抓帧/进度模块）。
  - scripts/__init__.py
  - scripts/_bridge_common.py
  - scripts/action_bridge.py
  - scripts/agent_bridge.py
  - scripts/agent_hook_bridge.py
  - scripts/agent_session_bridge.py
  - scripts/agent_worker.py
  - scripts/bridge_progress.py
  - scripts/calendar_bridge.py
  - scripts/conversation_bridge.py
  - scripts/deliver_text_bridge.py
  - scripts/electron_bridge.py
  - scripts/element_probe_bridge.py
  - scripts/expand_passage_bridge.py
  - scripts/fabric_bridge.py
  - scripts/frame_capture_worker.py
  - scripts/frame_lease.py
  - scripts/install_agent_hooks.py
  - scripts/local_voice_bridge.py
  - scripts/local_voice_worker.py
  - scripts/magic_pointer_mcp.py
  - scripts/ocr_resident_worker.py
  - scripts/office_selection_probe.vbs
  - scripts/pointer_input_state.ps1
  - scripts/selection_bridge.py
  - scripts/selection_snapshot_bridge.py
  - scripts/sense_voice_bridge.py
  - scripts/sense_voice_setup.py
  - scripts/shopping_list_bridge.py
  - scripts/smoke_fabric.py
  - scripts/stash_describe_bridge.py
  - scripts/start_windows_dictation.ps1
  - scripts/uia_draft_writer.cs
  - scripts/uia_selection_probe.cs
  - scripts/voice_engine.py
  - build/scripts/collect-diagnostics.js
  - native/macos/magic-pointer-host
  - assets/app/icon.ico
  - data/model_capabilities.v1.json
  - data/preflight_manifest.v1.json
  - data/recipes/**
  - data/surface_adapters/**
  - data/plugins/**
  - data/objects/**
  - data/README.md
  - requirements.txt
  - package.json
  - THIRD_PARTY_NOTICES.md

extraResources:
  - from: build/python-runtime
    to: python-runtime
    filter:
      - '**/*'

win:
  icon: assets/app/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Magic Pointer
  uninstallDisplayName: Magic Pointer
  installerIcon: assets/app/icon.ico
  uninstallerIcon: assets/app/icon.ico
  warningsAsErrors: false
  # Enable delta updates. electron-updater will fall back to full download if
  # blockmap comparison fails, so this is safe to keep on by default.
  differentialPackage: true
  include: packaging/installer.nsh

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Magic Pointer 使用麦克风离线转写你的短命令，音频不会离开本机。
    NSAppleEventsUsageDescription: Magic Pointer 通过 Apple Events 让选中的应用执行原位改写与翻译。
    NSAccessibilityUsageDescription: Magic Pointer 通过辅助功能读取当前应用的选区与前台窗口。
    NSScreenCaptureUsageDescription: Magic Pointer 仅在你指点屏幕对象时截图作为视觉兜底。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  writeUpdateInfo: true
  sign: false
