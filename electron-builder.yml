appId: com.magicpointer.desktop
productName: Magic Pointer
executableName: Magic Pointer
artifactName: Magic-Pointer-${version}-${arch}.${ext}

publish:
  provider: github
  owner: Wang-auspicious
  repo: Magic-Pointer

directories:
  output: release
  buildResources: packaging

asar: false
npmRebuild: false

files:
  - build/electron/**
  - build/figma/**
  - build/scripts/collect-diagnostics.js
  - scripts/desktop_host.cs
  - scripts/desktop_ocr.ps1
  - scripts/uia_draft_writer.cs
  - scripts/uia_selection_probe.cs
  - scripts/wgc_capture_tool.cs
  - scripts/office_selection_probe.vbs
  - scripts/pointer_input_state.ps1
  - native/macos/magic-pointer-host
  - assets/app/icon.ico
  - data/model_capabilities.v1.json
  - data/preflight_manifest.v1.json
  - data/recipes/**
  - data/surface_adapters/**
  - data/plugins/**
  - package.json
  - THIRD_PARTY_NOTICES.md
win:
  icon: assets/app/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Magic Pointer
  uninstallDisplayName: Magic Pointer
  installerIcon: assets/app/icon.ico
  uninstallerIcon: assets/app/icon.ico
  warningsAsErrors: false
  # Enable delta updates. electron-updater will fall back to full download if
  # blockmap comparison fails, so this is safe to keep on by default.
  differentialPackage: true
  include: packaging/installer.nsh

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Magic Pointer 通过 Apple Events 让选中的应用执行原位改写与翻译。
    NSAccessibilityUsageDescription: Magic Pointer 通过辅助功能读取当前应用的选区与前台窗口。
    NSScreenCaptureUsageDescription: Magic Pointer 仅在你指点屏幕对象时截图作为视觉兜底。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  writeUpdateInfo: true
  sign: false
